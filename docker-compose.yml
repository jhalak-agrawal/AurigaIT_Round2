version: "3.8"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: av_admin
      POSTGRES_PASSWORD: av_password
      POSTGRES_DB: av_room
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U av_admin -d av_room"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
